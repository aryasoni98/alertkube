# End-to-end demo workloads for the Docker Desktop playground.
# Each one deliberately triggers a different alertkube alert path.
# Tear down with: kubectl delete ns alertkube-demo
apiVersion: v1
kind: Namespace
metadata:
  name: alertkube-demo
  labels: {purpose: alertkube-e2e}
---
# 1) CrashLoopBackOff (critical) — container exits non-zero, restarts forever.
apiVersion: apps/v1
kind: Deployment
metadata: {name: crashloop-api, namespace: alertkube-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: crashloop-api}}
  template:
    metadata: {labels: {app: crashloop-api}}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo booting; sleep 2; echo crashing; exit 1"]
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: crashloop-api, namespace: alertkube-demo}
spec:
  selector: {app: crashloop-api}
  ports: [{port: 80, targetPort: 8080}]
---
# 2) ImagePullBackOff (warning) + DeploymentUnavailable (warning) — bad image tag.
apiVersion: apps/v1
kind: Deployment
metadata: {name: imagepull-web, namespace: alertkube-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: imagepull-web}}
  template:
    metadata: {labels: {app: imagepull-web}}
    spec:
      containers:
        - name: web
          image: nginx:this-tag-does-not-exist-9999
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: imagepull-web, namespace: alertkube-demo}
spec:
  selector: {app: imagepull-web}
  ports: [{port: 80, targetPort: 80}]
---
# 3) OOMKilled (critical) — allocates well past its memory limit.
apiVersion: apps/v1
kind: Deployment
metadata: {name: oom-cache, namespace: alertkube-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: oom-cache}}
  template:
    metadata: {labels: {app: oom-cache}}
    spec:
      containers:
        - name: hog
          image: polinux/stress:latest
          command: ["stress"]
          args: ["--vm", "1", "--vm-bytes", "250M", "--vm-hang", "0"]
          resources: {requests: {memory: 32Mi}, limits: {memory: 64Mi}}
---
# 4) JobFailed (critical) — backoffLimit exhausted on a failing command.
apiVersion: batch/v1
kind: Job
metadata: {name: batch-report, namespace: alertkube-demo}
spec:
  backoffLimit: 1
  template:
    metadata: {labels: {app: batch-report}}
    spec:
      restartPolicy: Never
      containers:
        - name: report
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo generating report; sleep 2; exit 2"]
          resources: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 50m, memory: 32Mi}}
---
# 5) PVCPending (warning) — references a storage class that does not exist.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: payments-data, namespace: alertkube-demo}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: does-not-exist-storageclass
  resources: {requests: {storage: 1Gi}}
---
# 6) CONTROL: healthy service that must NOT alert (negative test).
apiVersion: apps/v1
kind: Deployment
metadata: {name: healthy-frontend, namespace: alertkube-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: healthy-frontend}}
  template:
    metadata: {labels: {app: healthy-frontend}}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: healthy-frontend, namespace: alertkube-demo}
spec:
  selector: {app: healthy-frontend}
  ports: [{port: 80, targetPort: 80}]
