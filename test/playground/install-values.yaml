# Helm values for the local Docker Desktop end-to-end playground.
# NOT for production — tuned for fast, visible alerts on a disposable cluster.
cluster: docker-desktop-demo

image:
  repository: alertkube
  tag: e2e
  pullPolicy: Never        # use the locally-built image, never pull from a registry

rbac:
  scope: cluster           # watch all namespaces + nodes

# Slack webhook is injected at install time via --set so it never lands in git.
slack:
  username: alertkube-demo
  channels:
    critical: alerts-critical
    warning: alerts-warning
    info: alerts-info

# Accept Alertmanager webhooks too, guarded by a bearer token.
receiver:
  enabled: true
  token: demo-receiver-token

# Snapshot state so a controller restart still emits pending resolves.
persistence:
  enabled: true

# Tuned as fast as validation allows: muteSeconds/resolveTTLSeconds must exceed
# the 300s informer resync period (config rejects anything <=300), so the demo
# shows a resolve after ~6 min rather than the 10-min production defaults.
behavior:
  startupGraceSeconds: 0   # fire standing conditions immediately on first sync
  resolveTTLSeconds: 360   # synthesize a resolve ~6 min after a condition stops firing (floor is 300)
  pvcPendingSeconds: 30    # alert on a Pending PVC after 30s
  muteSeconds: 360         # re-alert window for a still-firing condition (floor is 300)

# Send everything to Slack AND stdout so alerts are visible in the pod logs.
routing:
  - match: {severity: critical}
    sinks: [slack, stdout]
  - match: {severity: warning}
    sinks: [slack, stdout]
  - match: {severity: info}
    sinks: [slack, stdout]

# NodeNotReady inhibits Pod alerts on the same node (default rule kept).
inhibitions:
  - source: {kind: Node, reason: NodeNotReady}
    target: {kind: Pod}
    equal: [node]
    duration: 10m

metrics:
  enabled: true
  port: 9090
