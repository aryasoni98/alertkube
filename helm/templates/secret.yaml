{{- $slackInline    := and (not .Values.slack.webhookUrlSecretKeyRef.name)        .Values.slack.webhookUrl }}
{{- $slackBotInline := and (not .Values.slack.botTokenSecretKeyRef.name)          .Values.slack.botToken }}
{{- $pdInline       := and (not .Values.pagerduty.routingKeySecretKeyRef.name)    .Values.pagerduty.routingKey }}
{{- $teamsInline    := and (not .Values.teams.webhookUrlSecretKeyRef.name)        .Values.teams.webhookUrl }}
{{- $webhookInline  := and (not .Values.genericWebhook.urlSecretKeyRef.name)      .Values.genericWebhook.url }}
{{- $discordInline  := and (not .Values.discord.webhookUrlSecretKeyRef.name)      .Values.discord.webhookUrl }}
{{- $tgInline       := and (not .Values.telegram.botTokenSecretKeyRef.name)       .Values.telegram.botToken }}
{{- $ogInline       := and (not .Values.opsgenie.apiKeySecretKeyRef.name)         .Values.opsgenie.apiKey }}
{{- $recvInline     := and (not .Values.receiver.tokenSecretKeyRef.name)          .Values.receiver.token }}
{{- $signing        := .Values.genericWebhook.signingSecret }}
{{- if or $slackInline $slackBotInline $pdInline $teamsInline $webhookInline $discordInline $tgInline $ogInline $recvInline $signing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alertkube.fullname" . }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $slackInline }}
  slackWebhookUrl: {{ .Values.slack.webhookUrl | b64enc | quote }}
  {{- end }}
  {{- if $slackBotInline }}
  slackBotToken: {{ .Values.slack.botToken | b64enc | quote }}
  {{- end }}
  {{- if $pdInline }}
  pagerdutyRoutingKey: {{ .Values.pagerduty.routingKey | b64enc | quote }}
  {{- end }}
  {{- if $teamsInline }}
  teamsWebhookUrl: {{ .Values.teams.webhookUrl | b64enc | quote }}
  {{- end }}
  {{- if $webhookInline }}
  genericWebhookUrl: {{ .Values.genericWebhook.url | b64enc | quote }}
  {{- end }}
  {{- if $discordInline }}
  discordWebhookUrl: {{ .Values.discord.webhookUrl | b64enc | quote }}
  {{- end }}
  {{- if $tgInline }}
  telegramBotToken: {{ .Values.telegram.botToken | b64enc | quote }}
  {{- end }}
  {{- if $ogInline }}
  opsgenieApiKey: {{ .Values.opsgenie.apiKey | b64enc | quote }}
  {{- end }}
  {{- if $recvInline }}
  receiverToken: {{ .Values.receiver.token | b64enc | quote }}
  {{- end }}
  {{- if $signing }}
  genericWebhookSecret: {{ $signing | b64enc | quote }}
  {{- end }}
{{- end }}
