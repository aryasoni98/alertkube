{{- $clusterScope := eq (.Values.rbac.scope | default "cluster") "cluster" -}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "alertkube.fullname" . }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
---
{{- if $clusterScope }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "alertkube.fullname" . }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
rules:
# persistentvolumes is omitted: only PVCs are watched (NewPVC), never the
# cluster-scoped PV objects. pods/log is granted separately below so it can
# be dropped entirely when log collection is disabled.
- apiGroups: [""]
  resources: ["nodes", "pods", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
# events are only listed on demand for alert enrichment (PodEvents /
# NodeEvents); they are never watched via an informer or fetched by name,
# so list is the only verb required.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list"]
{{- if not .Values.behavior.disableLogCollection }}
# Log enrichment reads the prior-container log stream (GetLogs = GET on the
# pods/log subresource). When behavior.disableLogCollection=true this grant
# disappears, so a compromised controller cannot read any pod's logs.
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
{{- end }}
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "alertkube.fullname" . }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "alertkube.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "alertkube.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
{{- else }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "alertkube.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch"]
# events are only listed on demand for alert enrichment, never watched or
# fetched by name - list is the only verb required.
- apiGroups: [""]
  resources: ["events"]
  verbs: ["list"]
{{- if not .Values.behavior.disableLogCollection }}
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
{{- end }}
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "alertkube.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "alertkube.fullname" . }}
subjects:
- kind: ServiceAccount
  name: {{ include "alertkube.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
{{- end }}
{{- if .Values.leaderElection.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "alertkube.fullname" . }}-leader-election
  namespace: {{ .Values.leaderElection.namespace | default .Release.Namespace | quote }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
rules:
# client-go leader election operates on a single named Lease: it Gets,
# Creates (first acquisition), and Updates/Patches (renewal). It never
# lists, watches, or deletes leases, so those verbs are withheld - delete
# in particular would let a compromised pod force re-elections.
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "alertkube.fullname" . }}-leader-election
  namespace: {{ .Values.leaderElection.namespace | default .Release.Namespace | quote }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "alertkube.fullname" . }}-leader-election
subjects:
- kind: ServiceAccount
  name: {{ include "alertkube.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
{{- end }}
{{- if .Values.persistence.enabled }}
---
# State persistence: the controller snapshots active-alert and mute state
# into a ConfigMap. get/update/patch are pinned to that one object;
# create cannot be resourceName-scoped (Kubernetes RBAC limitation) so it
# is granted on configmaps in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "alertkube.fullname" . }}-state
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: [{{ .Values.persistence.configMapName | default (printf "%s-state" (include "alertkube.fullname" .)) | quote }}]
  verbs: ["get", "update", "patch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "alertkube.fullname" . }}-state
  namespace: {{ .Release.Namespace | quote }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "alertkube.fullname" . }}-state
subjects:
- kind: ServiceAccount
  name: {{ include "alertkube.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
{{- end }}
