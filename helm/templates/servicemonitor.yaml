{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "alertkube.fullname" . }}
  labels:
    {{- include "alertkube.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels: {{- include "alertkube.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      # Explicit path/scheme: the controller serves plain HTTP /metrics, so a
      # cluster that defaults scrapes to https would otherwise fail silently.
      path: /metrics
      scheme: http
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout | default "10s" }}
{{- end }}
