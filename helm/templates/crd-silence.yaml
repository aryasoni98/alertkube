{{- if .Values.crds.silences.enabled }}
# AlertKube Silence CRD (opt-in). Lets operators manage silences with kubectl /
# GitOps as first-class objects instead of editing the controller ConfigMap.
# The controller watches these via a dynamic informer (no controller-runtime;
# see ADR-0001) when api/--watch-silence-crd is enabled. Templated (not in
# crds/) so it is purely opt-in and removed cleanly on uninstall.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: silences.alertkube.io
  labels: {{- include "alertkube.labels" . | nindent 4 }}
  {{- if .Values.crds.keep }}
  annotations:
    # Keep the CRD (and any Silence objects) on `helm uninstall` so a reinstall
    # does not drop active silences. Remove this to have Helm delete it.
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  group: alertkube.io
  scope: Namespaced
  names:
    kind: Silence
    listKind: SilenceList
    plural: silences
    singular: silence
    shortNames: [sil]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [matchers, until]
              properties:
                matchers:
                  description: >-
                    Key/value matchers selecting which alerts to silence. Same
                    semantics as config-file silences: namespace and reason accept
                    anchored regexes, all other keys are exact-match.
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                until:
                  description: RFC3339 timestamp after which the silence stops applying.
                  type: string
                  format: date-time
                comment:
                  description: Optional human note describing why the silence exists.
                  type: string
      additionalPrinterColumns:
        - name: Until
          type: string
          jsonPath: .spec.until
        - name: Comment
          type: string
          jsonPath: .spec.comment
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
