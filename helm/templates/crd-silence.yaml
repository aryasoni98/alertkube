{{- if .Values.crds.silences.enabled }}
# AlertKube Silence CRD (opt-in). Lets operators manage silences with kubectl /
# GitOps as first-class objects instead of editing the controller ConfigMap.
# The controller watches these via a dynamic informer (no controller-runtime;
# see ADR-0001) when --watch-silence-crd is enabled. Templated (not in crds/)
# so it is purely opt-in. It is kept on uninstall unless crds.keep=false.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: silences.alertkube.io
  labels: {{- include "alertkube.labels" . | nindent 4 }}
  {{- if .Values.crds.keep }}
  annotations:
    # Keep the CRD (and any Silence objects) on `helm uninstall` so a reinstall
    # does not drop active silences. Set crds.keep=false to have Helm delete it.
    "helm.sh/resource-policy": keep
  {{- end }}
spec:
  group: alertkube.io
  scope: {{ if .Values.crds.silences.clusterScoped }}Cluster{{ else }}Namespaced{{ end }}
  names:
    kind: Silence
    listKind: SilenceList
    plural: silences
    singular: silence
    shortNames: [sil]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [matchers, until]
              properties:
                matchers:
                  description: >-
                    Key/value matchers selecting which alerts to silence. Same
                    semantics as config-file silences: namespace and reason accept
                    anchored regexes, all other keys are exact-match. A namespaced
                    Silence only mutes its own namespace: an omitted namespace
                    matcher is set to it, and any other value, a pattern included,
                    makes the controller ignore the Silence (logged). So a
                    namespaced Silence cannot mute Node alerts, cloud-source
                    alerts, or receiver alerts without a namespace label; use a
                    cluster-scoped Silence or a config-file silence for those.
                  type: object
                  minProperties: 1
                  additionalProperties:
                    type: string
                    minLength: 1
                    description: >-
                      Empty values are rejected. A namespace or reason that
                      matches every alert, such as .*, is accepted here but
                      ignored by the controller (logged).
                until:
                  description: >-
                    RFC3339 timestamp after which the silence stops applying. The
                    controller stops applying it 30 days after creationTimestamp at
                    the latest; to extend a silence past that, recreate it.
                  type: string
                  format: date-time
                comment:
                  description: Optional human note describing why the silence exists.
                  type: string
      additionalPrinterColumns:
        - name: Until
          type: string
          jsonPath: .spec.until
        - name: Comment
          type: string
          jsonPath: .spec.comment
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
{{- end }}
