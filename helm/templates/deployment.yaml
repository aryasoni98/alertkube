apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alertkube.fullname" . }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
spec:
  {{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection.enabled) }}
  {{- fail "replicaCount > 1 requires leaderElection.enabled=true, otherwise every replica fires duplicate alerts" }}
  {{- end }}
  replicas: {{ .Values.replicaCount | default 1 }}
  strategy:
    {{- if .Values.leaderElection.enabled }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels: {{- include "alertkube.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels: {{- include "alertkube.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "alertkube.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alertkube
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "--config=/etc/alertkube/config.yaml"
            {{- if .Values.leaderElection.enabled }}
            - "--leader-elect=true"
            - "--leader-election-namespace={{ .Values.leaderElection.namespace | default .Release.Namespace }}"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: CLUSTER_NAME
              value: {{ required "cluster is required" .Values.cluster | quote }}
            {{- if eq (.Values.rbac.scope | default "cluster") "namespace" }}
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.genericWebhook.signingSecret }}
            - name: GENERIC_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: genericWebhookSecret
                  name: {{ include "alertkube.fullname" . }}
            {{- end }}
            - name: SLACK_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.slackWebhookSecret" . | indent 14 }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
              {{- include "alertkube.slackBotToken" . | indent 14 }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.discordWebhookUrl" . | indent 14 }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
              {{- include "alertkube.telegramBotToken" . | indent 14 }}
            {{- if .Values.telegram.chatId }}
            - name: TELEGRAM_CHAT_ID
              value: {{ .Values.telegram.chatId | quote }}
            {{- end }}
            - name: OPSGENIE_API_KEY
              valueFrom:
              {{- include "alertkube.opsgenieApiKey" . | indent 14 }}
            {{- if .Values.opsgenie.apiUrl }}
            - name: OPSGENIE_API_URL
              value: {{ .Values.opsgenie.apiUrl | quote }}
            {{- end }}
            {{- if .Values.receiver.enabled }}
            - name: ALERTKUBE_RECEIVER_TOKEN
              valueFrom:
              {{- include "alertkube.receiverToken" . | indent 14 }}
            {{- end }}
            - name: PAGERDUTY_ROUTING_KEY
              valueFrom:
              {{- include "alertkube.pagerdutyRoutingKey" . | indent 14 }}
            - name: TEAMS_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.teamsWebhookUrl" . | indent 14 }}
            - name: GENERIC_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.genericWebhookUrl" . | indent 14 }}
            - name: METRICS_ADDR
              value: ":{{ .Values.metrics.port }}"
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            initialDelaySeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alertkube
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "alertkube.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
