apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "alertkube.fullname" . }}
  labels: {{- include "alertkube.labels" . | nindent 4 }}
spec:
  {{- if and (gt (int .Values.replicaCount) 1) (not .Values.leaderElection.enabled) }}
  {{- fail "replicaCount > 1 requires leaderElection.enabled=true, otherwise every replica fires duplicate alerts" }}
  {{- end }}
  replicas: {{ .Values.replicaCount | default 1 }}
  strategy:
    {{- if .Values.leaderElection.enabled }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    type: Recreate
    {{- end }}
  selector:
    matchLabels: {{- include "alertkube.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "alertkube.selectorLabels" . | nindent 8 }}
        # Non-selector label: surfaces the running version in
        # `kubectl get pods -L app.kubernetes.io/version` during rollouts.
        app.kubernetes.io/version: {{ .Chart.AppVersion | quote }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "alertkube.fullname" . }}
      # Explicit rather than relying on the cluster default (true). The
      # controller needs an apiserver token to run informers, so the mount
      # stays on, but pinning it makes the blast radius of a container
      # compromise auditable (CWE-250). Override to false only if you inject
      # credentials another way.
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken | default true }}
      # Bounds graceful shutdown: the controller drains in-flight pod
      # enrichment, finishes sink sends (up to the per-sink timeout), and
      # saves final state. Must exceed that worst case so SIGKILL does not
      # truncate a resolve mid-flight or a state save.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 45 }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: alertkube
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (printf "v%s" .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - "--config=/etc/alertkube/config.yaml"
            {{- if .Values.leaderElection.enabled }}
            - "--leader-elect=true"
            - "--leader-election-namespace={{ .Values.leaderElection.namespace | default .Release.Namespace }}"
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          env:
            - name: CLUSTER_NAME
              value: {{ required "cluster is required" .Values.cluster | quote }}
            {{- if eq (.Values.rbac.scope | default "cluster") "namespace" }}
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.genericWebhook.signingSecret }}
            - name: GENERIC_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  key: genericWebhookSecret
                  name: {{ include "alertkube.fullname" . }}
            {{- end }}
            - name: SLACK_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.slackWebhookSecret" . | indent 14 }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
              {{- include "alertkube.slackBotToken" . | indent 14 }}
            - name: DISCORD_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.discordWebhookUrl" . | indent 14 }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
              {{- include "alertkube.telegramBotToken" . | indent 14 }}
            {{- if .Values.telegram.chatId }}
            - name: TELEGRAM_CHAT_ID
              value: {{ .Values.telegram.chatId | quote }}
            {{- end }}
            - name: OPSGENIE_API_KEY
              valueFrom:
              {{- include "alertkube.opsgenieApiKey" . | indent 14 }}
            {{- if .Values.opsgenie.apiUrl }}
            - name: OPSGENIE_API_URL
              value: {{ .Values.opsgenie.apiUrl | quote }}
            {{- end }}
            {{- if .Values.receiver.enabled }}
            - name: ALERTKUBE_RECEIVER_TOKEN
              valueFrom:
              {{- include "alertkube.receiverToken" . | indent 14 }}
            {{- end }}
            - name: ALERTKUBE_API_TOKEN
              valueFrom:
              {{- include "alertkube.apiToken" . | indent 14 }}
            - name: ALERTKUBE_API_WRITE_TOKEN
              valueFrom:
              {{- include "alertkube.apiWriteToken" . | indent 14 }}
            - name: ALERTKUBE_AUTH_MODE
              value: {{ .Values.api.authMode | default "token" | quote }}
            - name: ALERTKUBE_ALLOW_SECRET_READ
              value: {{ .Values.api.allowSecretRead | default false | quote }}
            - name: PAGERDUTY_ROUTING_KEY
              valueFrom:
              {{- include "alertkube.pagerdutyRoutingKey" . | indent 14 }}
            - name: TEAMS_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.teamsWebhookUrl" . | indent 14 }}
            - name: GENERIC_WEBHOOK_URL
              valueFrom:
              {{- include "alertkube.genericWebhookUrl" . | indent 14 }}
            - name: METRICS_ADDR
              value: ":{{ .Values.metrics.port }}"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
          # startupProbe gives the initial informer cache sync up to ~150s on
          # a large cluster before liveness starts counting, so a slow sync is
          # not mistaken for a hang. Liveness/readiness then run on tight
          # periods with explicit thresholds so an apiserver blip needs three
          # consecutive failures (not one) to act.
          startupProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /healthz, port: metrics}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: metrics}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/alertkube
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "alertkube.fullname" . }}-config
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
