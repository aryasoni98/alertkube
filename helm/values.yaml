# alertkube default values.

# -- Cluster name shown in every alert.
cluster: "Change-Me"

# replicaCount > 1 requires leaderElection.enabled=true. The Recreate
# strategy is used when leader election is off so two instances never
# overlap and re-fire each other's alerts after a restart.
# -- Replica count (>1 requires `leaderElection.enabled`).
replicaCount: 1

leaderElection:
  # -- Enable HA leader election via a coordination Lease.
  enabled: false
  # Namespace holding the Lease object. Defaults to the release namespace
  # if empty. kube-system or a shared "system" namespace is typical so
  # the release can be reinstalled without losing the lease.
  # -- Namespace for the Lease (defaults to the release namespace).
  namespace: ""

# Mounts the ServiceAccount token used to reach the apiserver. The
# controller needs it for informers, so this stays true; it is exposed as a
# value (and set explicitly on the pod) so the mount is auditable rather
# than implicit, and can be disabled if credentials are injected another way.
# -- Mount the ServiceAccount API token into the pod.
automountServiceAccountToken: true

# -- Extra arguments appended to the controller command line.
extraArgs: []

# -- Extra environment variables for the controller container. Use this to
# inject static AWS credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
# when not using IRSA, or any other sink credential by env.
extraEnv: []

# cluster: ClusterRole, watches all namespaces + nodes.
# namespace: Role limited to the release namespace; informers are scoped
# via WATCH_NAMESPACE and node alerts are disabled (nodes are
# cluster-scoped resources).
rbac:
  # -- RBAC scope: `cluster` (all namespaces + nodes) or `namespace`.
  scope: cluster   # cluster | namespace

# Kubernetes REST client throttling. client-go's library defaults (5 QPS /
# 10 burst) can throttle the initial list/watch sync and on-demand event/log
# enrichment on large clusters; alertkube raises them. Lower for
# API-server-constrained clusters, raise for very large ones.
client:
  # -- Client-side QPS to the API server (0 = controller default of 50).
  qps: 50
  # -- Client-side burst to the API server (0 = controller default of 100).
  burst: 100

# Alert delivery runs on a bounded worker pool decoupled from the informer/
# receiver/source goroutines: producers enqueue near-instantly while workers do
# the blocking sink fan-out, so a slow sink cannot stall Kubernetes event
# processing. Raise workers for many concurrent sinks; raise queueSize to absorb
# larger storms before backpressure kicks in.
dispatch:
  # -- Delivery worker pool size (0 = controller default of 16).
  workers: 0
  # -- Delivery queue capacity (0 = controller default of 2048).
  queueSize: 0

# Go pprof profiling on /debug/pprof (served on the data plane). Off by default
# and fail-closed: it will NOT be exposed unless api.token (or api.tokenSecret
# KeyRef) is set, so profiles are never served unauthenticated. Enable only for
# a debugging session, ideally with the data port restricted by a NetworkPolicy.
pprof:
  # -- Enable /debug/pprof profiling (requires an api token; fail-closed).
  enabled: false

# Opt-in CRDs. When enabled, the chart installs the CRD and grants the
# controller read-only RBAC, and the controller watches it via a dynamic
# informer (no controller-runtime; see ADR-0001). Off by default - the
# ConfigMap remains the source of truth for routing/rules; this only adds a
# kubectl/GitOps-native way to manage silences.
crds:
  # -- Keep CRDs on `helm uninstall` (helm.sh/resource-policy: keep) so active
  # Silence objects survive a reinstall. Set false to let Helm delete them.
  keep: true
  silences:
    # -- Install the Silence CRD + RBAC and watch silences.alertkube.io.
    enabled: false

image:
  # -- Controller image repository.
  repository: ghcr.io/aryasoni98/alertkube
  # Defaults to the chart appVersion when empty.
  # -- Image tag (defaults to the chart `appVersion`).
  tag: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# Slack - per-severity channels. slackWebhookUrl can come from a Secret.
slack:
  # -- Slack incoming webhook URL (inline; prefer `webhookUrlSecretKeyRef`).
  webhookUrl: ""
  # -- Username shown on Slack webhook messages.
  username: "alertkube"
  channels:
    # -- Channel for critical alerts (bot-token mode only).
    critical: "alerts-critical"
    # -- Channel for warning alerts (bot-token mode only).
    warning: "alerts-warning"
    # -- Channel for info alerts (bot-token mode only).
    info: "alerts-info"
  # External Secret reference (set webhookUrl to "" to use it).
  # -- Secret reference for the webhook URL (`{key, name}`).
  webhookUrlSecretKeyRef: {}
    # key: slackWebhookUrl
    # name: alertkube
  # Bot token mode (chat.postMessage). Takes precedence over webhookUrl
  # and is the only mode where per-severity channel routing works with a
  # modern Slack app (webhooks ignore the channel field). Needs the
  # chat:write scope and the bot invited to each channel.
  # -- Slack bot token (chat.postMessage); enables per-severity channels.
  botToken: ""
  # -- Secret reference for the bot token (`{key, name}`).
  botTokenSecretKeyRef: {}
    # key: slackBotToken
    # name: alertkube

pagerduty:
  # -- PagerDuty Events API v2 routing key (inline; prefer the Secret ref).
  routingKey: ""
  # External Secret reference (set routingKey to "" to use it).
  # -- Secret reference for the routing key (`{key, name}`).
  routingKeySecretKeyRef: {}
    # key: pagerdutyRoutingKey
    # name: alertkube-pagerduty

teams:
  # -- Microsoft Teams incoming webhook URL (inline; prefer the Secret ref).
  webhookUrl: ""
  # -- Secret reference for the Teams webhook URL (`{key, name}`).
  webhookUrlSecretKeyRef: {}
    # key: teamsWebhookUrl
    # name: alertkube-teams

discord:
  # -- Discord channel webhook URL (inline; prefer the Secret ref).
  webhookUrl: ""
  # -- Secret reference for the Discord webhook URL (`{key, name}`).
  webhookUrlSecretKeyRef: {}
    # key: discordWebhookUrl
    # name: alertkube-discord

googlechat:
  # -- Google Chat space incoming-webhook URL (inline; prefer the Secret ref).
  webhookUrl: ""
  # -- Secret reference for the Google Chat webhook URL (`{key, name}`).
  webhookUrlSecretKeyRef: {}
    # key: googlechatWebhookUrl
    # name: alertkube-googlechat

mattermost:
  # -- Mattermost incoming-webhook URL (inline; prefer the Secret ref).
  webhookUrl: ""
  # -- Secret reference for the Mattermost webhook URL (`{key, name}`).
  webhookUrlSecretKeyRef: {}
    # key: mattermostWebhookUrl
    # name: alertkube-mattermost

telegram:
  # -- Telegram bot token from @BotFather (inline; prefer the Secret ref).
  botToken: ""
  # -- Target chat/channel id (not secret).
  chatId: ""
  # -- Secret reference for the Telegram bot token (`{key, name}`).
  botTokenSecretKeyRef: {}
    # key: telegramBotToken
    # name: alertkube-telegram

opsgenie:
  # -- Opsgenie Alert API key (inline; prefer the Secret ref).
  apiKey: ""
  # -- API URL override for the EU region (`https://api.eu.opsgenie.com`).
  apiUrl: ""
  # -- Secret reference for the Opsgenie API key (`{key, name}`).
  apiKeySecretKeyRef: {}
    # key: opsgenieApiKey
    # name: alertkube-opsgenie

genericWebhook:
  # -- Endpoint that receives the raw Alert JSON via POST.
  url: ""
  # -- Secret reference for the webhook URL (`{key, name}`).
  urlSecretKeyRef: {}
    # key: genericWebhookUrl
    # name: alertkube-webhook
  # Optional HMAC-SHA256 signing key. When set, every POST carries
  # `X-Alertkube-Signature: sha256=<hex(hmac(secret, timestamp.body))>`
  # and `X-Alertkube-Timestamp: <RFC3339>` so receivers can verify
  # authenticity and reject replay.
  # -- Optional HMAC-SHA256 signing key for request signatures.
  signingSecret: ""

# Re-dispatch still-unresolved alerts to extra sinks after a delay.
# Each rule fires at most once per alert lifetime.
# -- Escalation rules; re-dispatch unresolved alerts to extra sinks after a delay.
escalations: []
  # - match: {severity: critical}
  #   afterMinutes: 15
  #   sinks: [pagerduty]

# Accept Alertmanager webhook payloads on /api/v1/alerts (metrics port)
# and run them through the same dedupe/grouping/routing pipeline.
# Optional bearer auth: set receiver.token (stored in the chart Secret).
receiver:
  # -- Accept Alertmanager webhooks on `/api/v1/alerts`.
  enabled: false
  # -- Run the receiver without a token. Required to enable the receiver with
  # no token; otherwise startup fails closed (an open endpoint accepts
  # unauthenticated alert injection). Only set true when the port is locked
  # down by a NetworkPolicy.
  allowAnonymous: false
  # -- Optional bearer token guarding the receiver (inline; prefer the Secret ref).
  token: ""
  # -- Secret reference for the receiver token (`{key, name}`).
  tokenSecretKeyRef: {}
    # key: receiverToken
    # name: alertkube-receiver

# api guards the read-only /api/alerts introspection endpoint (active +
# recent alert contents) served on the metrics port. Set a token to require
# bearer auth; left empty the endpoint is open, so restrict the metrics port
# with networkPolicy instead.
api:
  # -- Optional bearer token guarding read endpoints (`/api/alerts`, `/api/config`, `/api/silences` GET, console data) (inline; prefer the Secret ref).
  token: ""
  # -- Secret reference for the API (read) token (`{key, name}`).
  tokenSecretKeyRef: {}
    # key: apiToken
    # name: alertkube-api
  # -- Optional SEPARATE bearer token enabling runtime WRITES (create/delete
  # silences from the console). Leave empty to keep the controller read-only:
  # write endpoints fail closed (403) until this is set. Inline; prefer the ref.
  writeToken: ""
  # -- Secret reference for the API write token (`{key, name}`).
  writeTokenSecretKeyRef: {}
    # key: apiWriteToken
    # name: alertkube-api
  # -- Write-path auth mode: `token` (shared writeToken, default) or `rbac`
  # (each write authenticated via Kubernetes TokenReview + SubjectAccessReview,
  # so audit records a real username and access is managed with RBAC). `rbac`
  # binds the controller SA to system:auth-delegator; grant END USERS access with
  # a Role on apiGroups:["alertkube.io"] resources:["silences","channels"].
  authMode: token
  # -- Opt-in (Phase 2b): allow the console to TEST a channel whose credential
  # lives in a Kubernetes Secret. Enabling this grants the controller `secrets:
  # get` in its OWN namespace (a Role, not cluster-wide) and is the one place the
  # zero-secrets-read posture bends. Off by default; the secret value is read at
  # send-time only and never returned to the client. Leave false unless you need
  # in-UI channel credential validation.
  allowSecretRead: false
  # -- Accept an UNAUTHENTICATED read API (/api/alerts + console data) when no
  # api.token and no networkPolicy are set. The chart fails closed by default:
  # an install with neither a token nor a NetworkPolicy is rejected unless this
  # is explicitly true, so an open introspection surface is always a deliberate
  # choice. Mirrors the receiver's allowAnonymous model.
  allowUnauthenticatedRead: false

# Fold alert storms: first alert of a group dispatches immediately,
# later same-group alerts within the window collapse into one summary
# ("4 more Pod CrashLoopBackOff alerts ..."). PagerDuty/Opsgenie still
# receive every resolve and never receive summaries.
grouping:
  # -- Fold alert storms into one summary per group.
  enabled: false
  # -- Window in seconds during which same-group alerts collapse.
  windowSeconds: 30
  # -- Grouping key fields.
  by: [kind, namespace, reason, severity]

# Persist active-alert and mute state to a ConfigMap in the release
# namespace. A controller restart then still sends pending resolves
# (no dangling PagerDuty incidents) and does not re-page standing
# conditions. Adds a namespaced Role for the state ConfigMap.
#
# NOTE: the state ConfigMap is created by the controller at runtime, not by
# Helm, so `helm uninstall` does NOT remove it. A reinstall into the same
# namespace would then restore stale state (spurious resolves / suppressed
# alerts for up to resolveTTLSeconds). After uninstall, delete it manually:
#   kubectl delete configmap <release>-state -n <namespace>
persistence:
  # -- Snapshot active-alert and mute state to a ConfigMap.
  enabled: true
  # Defaults to "<fullname>-state" when empty.
  # -- State ConfigMap name (defaults to `<fullname>-state`).
  configMapName: ""

# AWS cloud sources poll AWS APIs for cloud-resource alerts alongside the
# in-cluster Kubernetes watchers. Credentials resolve via the standard AWS
# chain; the recommended in-cluster setup is IRSA - annotate the
# ServiceAccount with the IAM role ARN via serviceAccount.annotations.
# pollSeconds must stay below behavior.resolveTTLSeconds.
#
# EXPERIMENTAL (new in v0.3): cloud sources are validated against recorded SDK
# responses, not yet against live AWS accounts at scale. Toggle per service.
aws:
  # -- Enable polling AWS APIs for cloud alerts (per-service toggles below:
  #    EKS, CloudWatch, EC2, ELBv2, RDS, DynamoDB, ElastiCache, S3, CloudTrail,
  #    ASG, KMS, EBS, Aurora, NAT, EFS, Route53, ACM, VPN).
  enabled: false
  # -- AWS regions to poll. Required when aws.enabled is true.
  regions: []
  # -- Seconds between polls (must be below behavior.resolveTTLSeconds).
  pollSeconds: 60
  # -- Alert on EKS cluster discovery + control-plane health.
  eks: false
  # -- Alert on CloudWatch alarms in ALARM state (covers EC2/ALB/NLB/RDS/custom metrics).
  cloudwatch: false
  # -- Alert on EC2 instance system/instance status-check failures.
  ec2: false
  # -- Alert on ALB/NLB availability + target-group health (ELBv2).
  elbv2: false
  # -- Alert on RDS DB instance status (failed/storage-full/stopped/...).
  rds: false
  # -- Alert on DynamoDB table status (inaccessible-encryption / archived).
  dynamodb: false
  # -- Alert on ElastiCache cluster status (incompatible-network / restore-failed).
  elasticache: false
  # -- Alert on S3 buckets that are publicly accessible or not fully blocked.
  s3: false
  # -- Alert on CloudTrail security changes (security-group / S3-policy / IAM).
  cloudtrail: false
  # -- Override CloudTrail event names to watch (empty = curated security set).
  cloudtrailEvents: []
  # -- Alert on Auto Scaling Groups below desired healthy capacity.
  asg: false
  # -- Alert on customer-managed KMS keys in a risky state (pending-deletion/disabled).
  kms: false
  # -- Alert on EBS volumes whose status check is impaired.
  ebs: false
  # -- Alert on Aurora DB clusters in an unhealthy state.
  aurora: false
  # -- Alert on NAT gateways in the failed state.
  nat: false
  # -- Alert on EFS file systems in the error lifecycle state.
  efs: false
  # -- Alert on Route53 health checks failing from a majority of checkers.
  route53: false
  # -- Alert on ACM certificates that are unusable or expiring within 30 days.
  acm: false
  # -- Alert on Site-to-Site VPN connections with tunnels down.
  vpn: false

# Azure cloud sources poll Azure APIs for cloud-resource alerts. Credentials
# resolve via DefaultAzureCredential; in-cluster the recommended setup is AKS
# Workload Identity (set the client-id annotation/labels via serviceAccount and
# podAnnotations). Subscription-scoped. Disabled by default.
#
# EXPERIMENTAL (new in v0.3): cloud sources are validated against recorded SDK
# responses, not yet against live Azure subscriptions at scale.
azure:
  # -- Enable polling Azure APIs for cloud alerts (per-service toggles below:
  #    AKS, Monitor, VMs, Storage, SQL, Redis).
  enabled: false
  # -- Azure subscription IDs to poll. Required when azure.enabled is true.
  subscriptions: []
  # -- Seconds between polls (must be below behavior.resolveTTLSeconds).
  pollSeconds: 60
  # -- Alert on AKS cluster discovery + control-plane health.
  aks: false
  # -- Ingest fired Azure Monitor alerts (Alerts Management): Fired pages, Resolved resolves.
  monitor: false
  # -- Alert on Azure VM provisioning failures.
  vms: false
  # -- Alert on Azure Storage account primary-endpoint unavailability.
  storage: false
  # -- Alert on Azure SQL databases in an unhealthy status (Suspect/Offline/Inaccessible).
  sql: false
  # -- Alert on Azure Cache for Redis in a failed provisioning state.
  redis: false

# GCP cloud sources poll Google Cloud APIs for cloud-resource alerts.
# Credentials resolve via Application Default Credentials; in-cluster the
# recommended setup is GKE Workload Identity (annotate serviceAccount with
# iam.gke.io/gcp-service-account). Project-scoped. Disabled by default.
#
# EXPERIMENTAL (new in v0.3): cloud sources are validated against recorded SDK
# responses, not yet against live GCP projects at scale.
gcp:
  # -- Enable polling Google Cloud APIs for cloud alerts (per-service toggles
  #    below: GKE, Monitoring, Compute, CloudSQL).
  enabled: false
  # -- GCP project IDs to poll. Required when gcp.enabled is true.
  projects: []
  # -- Seconds between polls (must be below behavior.resolveTTLSeconds).
  pollSeconds: 60
  # -- Alert on GKE cluster discovery + health.
  gke: false
  # -- Cloud Monitoring posture: alert when an alert policy is disabled (not a fired-incident feed).
  monitoring: false
  # -- Alert on Compute Engine instances in REPAIRING state.
  compute: false
  # -- Alert on Cloud SQL instance state (failed/suspended/maintenance).
  cloudsql: false

serviceAccount:
  # -- Extra annotations on the controller ServiceAccount. For AWS IRSA set
  # `eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role>`.
  annotations: {}

filters:
  # -- Comma-separated namespaces to watch (empty = all).
  watchedNamespaces: ""
  # -- Comma-separated namespaces to ignore.
  ignoredNamespaces: ""
  # -- Comma-separated pod-name prefixes to watch.
  watchedPodNamePrefixes: ""
  # -- Comma-separated pod-name prefixes to ignore.
  ignoredPodNamePrefixes: ""

behavior:
  # -- Re-alert mute window in seconds for a still-firing condition.
  muteSeconds: 600
  # -- Restart count above which CrashLoopBackOff stops re-alerting.
  ignoreRestartCount: 30
  # -- Skip alerts for restarts that exited with code 0.
  ignoreRestartsWithExitCodeZero: false
  # -- Seconds an alert may stay unseen before it is treated as resolved.
  resolveTTLSeconds: 600
  # Suppress alerts fired during the first N seconds after start. The
  # informer initial sync re-fires every standing condition (e.g.
  # CrashLoopBackOff pods) on each controller restart; the grace window
  # mutes those re-fires. Conditions still firing after the window alert
  # normally once the mute window expires. 0 disables.
  # -- Mute alerts fired during the first N seconds after start (0 disables).
  startupGraceSeconds: 30
  # How long a PVC may stay Pending before alerting (provisioners
  # legitimately take a while).
  # -- Seconds a PVC may stay Pending before alerting.
  pvcPendingSeconds: 300
  # Stop fetching previous-container logs for alert enrichment. Logs are
  # redacted before forwarding, but redaction is pattern-based and
  # best-effort - strict environments should disable collection instead
  # of trusting it.
  # -- Disable previous-container log collection for alert enrichment.
  disableLogCollection: false
  # Ignore `alert-silence-until` pod annotations. Anyone with patch on a
  # workload can otherwise silence its own alerts.
  # -- Ignore `alert-silence-until` pod annotations (anti-self-silence).
  disableAnnotationSilences: false

metrics:
  # -- Expose the metrics/health HTTP server.
  enabled: true
  # -- Port for `/metrics`, `/healthz`, `/readyz`.
  port: 9090
  serviceMonitor:
    # -- Create a Prometheus Operator `ServiceMonitor`.
    enabled: false
    # -- Scrape interval for the ServiceMonitor.
    interval: 30s
    # -- Per-scrape timeout (must be <= interval).
    scrapeTimeout: 10s
    # -- Extra labels on the ServiceMonitor.
    labels: {}

# Self-health PrometheusRule (requires the Prometheus Operator). Alerts on
# alertkube being down/unscraped, sustained sink errors, rate-limit drops, and
# dispatch saturation - the "who watches the watcher" rules.
prometheusRule:
  # -- Create a self-health `PrometheusRule` (requires the Prometheus Operator).
  enabled: false
  # namespace: ""               # defaults to the release namespace
  # -- Extra labels so your Prometheus selects the rule.
  labels: {}
  # -- How long alertkube metrics may be absent before `AlertkubeAbsent` fires.
  absentFor: "10m"
  # -- `AlertkubeDispatchSaturated` in-flight threshold.
  dispatchInflightThreshold: 20
  # -- Extra PrometheusRule entries appended verbatim.
  additionalRules: []

# Remap alert severities before dedupe/routing. First match wins.
# match semantics are the same as routing rules (namespace/reason accept
# anchored regexes, other keys are exact).
# -- Severity remap rules applied before dedupe/routing (first match wins).
severityOverrides: []
  # - match: {kind: Pod, reason: ImagePullBackOff, namespace: dev-.*}
  #   severity: info
  # - match: {kind: Job, reason: JobFailed, namespace: batch-noncritical}
  #   severity: warning

# Per-sink send rate overrides (token bucket). Unlisted sinks default to
# 1 msg/sec with burst 5 (Slack's published webhook limit).
# -- Per-sink token-bucket rate overrides (default 1 msg/s, burst 5).
sinkRates: {}
  # slack:
  #   perSecond: 1
  #   burst: 5
  # pagerduty:
  #   perSecond: 10
  #   burst: 20

# Free-form routing/inhibition/silence rules rendered into ConfigMap.
# -- Routing rules mapping alert matches to sinks (rendered into the ConfigMap).
routing:
  - match: {severity: critical}
    sinks: [slack, pagerduty]
  - match: {severity: warning}
    sinks: [slack]
  - match: {severity: info}
    sinks: [slack]

# -- Inhibition rules that suppress targets while a source alert is active.
inhibitions:
  - source: {kind: Node, reason: NodeNotReady}
    target: {kind: Pod}
    equal: [node]
    duration: 10m

# -- Standing silence rules.
silences: []

# Recurring maintenance windows: suppress matching alerts on a daily schedule
# (optionally restricted to weekdays), unlike one-shot `silences` that end at a
# single timestamp. Times are HH:MM in the window's timezone (IANA name; empty =
# UTC); a window may wrap midnight (start > end).
# -- Recurring daily maintenance windows that suppress matching alerts.
maintenance: []
  # - name: nightly-backup
  #   matchers: {namespace: prod, reason: PVCPending}
  #   start: "23:00"
  #   end: "02:00"
  #   days: [sat, sun]     # optional; empty = every day
  #   timezone: UTC        # optional; empty = UTC

# -- Custom correlation rules; each fires a derived alert (kind Derived) when
# its condition holds. Exactly one of count/all/absent per rule.
rules: []
  # - name: prod-pod-storm
  #   severity: critical
  #   windowSeconds: 300
  #   count: {match: {namespace: prod, reason: CrashLoopBackOff}, threshold: 5}
  # - name: watchdog-missing
  #   severity: critical
  #   absent: {match: {kind: External, name: watchdog}, forSeconds: 600}

resources:
  # -- Resource limits.
  limits:
    cpu: 200m
    memory: 256Mi
  # -- Resource requests.
  requests:
    cpu: 50m
    memory: 64Mi

# -- Image pull secrets.
imagePullSecrets: []
# -- Override the chart name portion of resource names.
nameOverride: ""
# -- Override the full resource name.
fullnameOverride: ""
# -- Extra annotations on the controller pod.
podAnnotations: {}

# Graceful shutdown budget. Must exceed the controller's worst-case drain:
# in-flight pod enrichment + the longest sink send + the final state save.
# -- Seconds the pod gets to drain before SIGKILL.
terminationGracePeriodSeconds: 45

# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: ["ALL"]

# -- Node selector for scheduling.
nodeSelector: {}
# -- Tolerations for scheduling.
tolerations: []
# -- Affinity rules for scheduling.
affinity: {}

podDisruptionBudget:
  # -- Create a PodDisruptionBudget (only meaningful with leader election +
  # replicaCount > 1; a single-replica controller should not set one).
  enabled: false
  # maxUnavailable is the safe default: it lets a node drain evict the pod
  # (the Deployment reschedules it) instead of wedging cluster upgrades. Use
  # minAvailable only with replicaCount > 1 + leader election. Setting
  # minAvailable: 1 with a single replica blocks ALL voluntary disruptions.
  # -- Tolerated unavailable replicas during voluntary disruption.
  maxUnavailable: 1
  # -- Minimum available replicas (mutually exclusive with maxUnavailable).
  minAvailable: ""

networkPolicy:
  # -- Restrict metrics ingress and controller egress with a NetworkPolicy.
  enabled: false
  # Kubernetes API server endpoints. Required when enabled: NetworkPolicy
  # sees post-DNAT endpoint IPs, which the private-range exclusions below
  # would otherwise block, cutting the controller off from the API.
  # Find them with: kubectl get endpoints kubernetes
  apiServer:
    # -- API server endpoint CIDRs (e.g. `["10.0.0.2/32"]`); required when enabled.
    cidrs: []
    # -- API server endpoint target port (often 6443 on self-managed).
    port: 443
  # Sink egress allow-list. When empty, egress on 443/TCP is allowed to
  # anywhere except link-local and the RFC-1918 private ranges. Set this to
  # the explicit CIDRs of on-prem / private sinks (self-hosted Alertmanager,
  # internal webhooks) that the private-range exclusion would otherwise cut
  # off; doing so replaces the broad rule with a tight allow-list.
  # -- Sink endpoint CIDRs reachable on 443/TCP (empty = anywhere minus private ranges).
  sinkCIDRs: []
    # - 10.20.0.0/24
  # Restrict who can scrape /metrics. Defaults to allow-all when empty.
  # -- Sources allowed to scrape `/metrics` (empty = allow all).
  ingressFrom: []
    # - namespaceSelector:
    #     matchLabels:
    #       kubernetes.io/metadata.name: monitoring
  # -- Extra egress rules appended verbatim.
  extraEgress: []
