version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    # Expanded set (1.5.1). High-signal linters for an HTTP-heavy,
    # security-sensitive controller. Each one was verified to pass on the
    # current tree before being added.
    - bodyclose       # every HTTP response body is closed (sinks/receiver)
    - errorlint       # %w wrapping + errors.Is/As instead of == comparisons
    - noctx           # no HTTP requests without a context
    - nilerr          # never return nil when err is non-nil
    - durationcheck   # no accidental time.Duration multiplication bugs
    - wastedassign    # assignments whose value is never used
    - usestdlibvars   # use http.MethodGet etc. instead of string literals
    - predeclared     # don't shadow predeclared identifiers
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - noctx       # httptest.NewRequest is the idiomatic test constructor
        path: _test\.go
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
