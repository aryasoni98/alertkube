version: "2"
run:
  tests: true
  # Lint the envtest suite in test/integration too; without the tag its files
  # are excluded from the build and never checked.
  build-tags:
    - integration
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unused
    # Expanded set (1.5.1). High-signal linters for an HTTP-heavy,
    # security-sensitive controller. The pinned CI linter (lint.yml) enforces
    # them; a deliberate exception carries `//nolint:<linter> // reason` at the
    # line, or a narrow exclusion rule below.
    #
    # contextcheck and containedctx are deliberately NOT enabled. The dispatch,
    # drain and final-save contexts are detached from the controller ctx on
    # purpose (resolves must deliver during shutdown; see the timeout budget in
    # app/pipeline.go), and dispatchJob.traceCtx is a struct-held span link.
    # Both linters flag that design by construction.
    - bodyclose       # every HTTP response body is closed (sinks/receiver)
    - errorlint       # %w wrapping + errors.Is/As instead of == comparisons
    - noctx           # no HTTP requests without a context
    - nilerr          # never return nil when err is non-nil
    - durationcheck   # no accidental time.Duration multiplication bugs
    - wastedassign    # assignments whose value is never used
    - usestdlibvars   # use http.MethodGet etc. instead of string literals
    - predeclared     # don't shadow predeclared identifiers
    - copyloopvar     # Go 1.22+ gives each iteration its own loop variables
    - intrange        # use integer ranges where the loop bound is stable
    - gosec           # security checks (SSRF, overflow, weak rand, secrets)
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          disabled: true
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - noctx       # httptest.NewRequest is the idiomatic test constructor
        path: _test\.go
      # The sink credential constants in sinks/cred.go are the NAMES of the
      # env vars credentials are read from (e.g. SLACK_BOT_TOKEN), not the
      # credentials themselves.
      - linters:
          - gosec
        path: internal/sinks/cred\.go
        text: G101
        source: '^\s*env[A-Za-z]+\s*= "[A-Z0-9_]+"$'
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - third_party$
      - builtin$
      - examples$
