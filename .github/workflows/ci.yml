name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate
        # Fails the build if total statement coverage drops below the floor.
        # Ratchet target: raise toward 75% as more e2e/root tests land
        # (see docs/ROADMAP.md). Only ever raise this. Current measured total is
        # ~70%; the gate is held a few points below to absorb normal churn.
        env:
          COVERAGE_THRESHOLD: "66"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (gate: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v g="$COVERAGE_THRESHOLD" 'BEGIN { exit (t+0 < g+0) ? 1 : 0 }' || {
            echo "::error::coverage ${total}% is below the ${COVERAGE_THRESHOLD}% gate"; exit 1; }

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      # Short fuzz run on each target to catch regressions on PRs. The corpus
      # lives in the Go build cache; this is a smoke test, not a soak.
      - name: Fuzz ComputeFingerprint
        run: go test -run='^$' -fuzz='^FuzzComputeFingerprint$' -fuzztime=30s ./internal/alert

      - name: Fuzz matchOrRegex
        run: go test -run='^$' -fuzz='^FuzzMatchOrRegex$' -fuzztime=30s ./internal/alert

      - name: Fuzz config Load
        run: go test -run='^$' -fuzz='^FuzzLoad$' -fuzztime=30s ./internal/config

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build (no push, both release arches)
        # Exercise the arm64 cross-compile path on PRs so an arch-specific
        # build break surfaces here, not at release time.
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
