name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build -v ./...

      - name: Version drift (manifest → helm, landing page, docs)
        run: scripts/sync-version.sh --check

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate
        # Fails the build if total statement coverage drops below the floor.
        # Ratchet target: raise toward 75% as more e2e/root tests land
        # (see docs/ROADMAP.md). Only ever raise this. Current measured total is
        # ~70%; the gate is held a few points below to absorb normal churn.
        env:
          COVERAGE_THRESHOLD: "66"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (gate: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v g="$COVERAGE_THRESHOLD" 'BEGIN { exit (t+0 < g+0) ? 1 : 0 }' || {
            echo "::error::coverage ${total}% is below the ${COVERAGE_THRESHOLD}% gate"; exit 1; }

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # Short fuzz run on each target to catch regressions on PRs. The corpus
      # lives in the Go build cache; this is a smoke test, not a soak.
      - name: Fuzz ComputeFingerprint
        run: go test -run='^$' -fuzz='^FuzzComputeFingerprint$' -fuzztime=30s ./internal/alert

      - name: Fuzz matchOrRegex
        run: go test -run='^$' -fuzz='^FuzzMatchOrRegex$' -fuzztime=30s ./internal/alert

      - name: Fuzz config Load
        run: go test -run='^$' -fuzz='^FuzzLoad$' -fuzztime=30s ./internal/config

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build (no push, both release arches)
        # Exercise the arm64 cross-compile path on PRs so an arch-specific
        # build break surfaces here, not at release time.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  integration:
    name: Integration (envtest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # envtest runs a real kube-apiserver + etcd (no kubelet/scheduler). This
      # tier exists because the sharding defects it guards - shared Lease,
      # shared state ConfigMap - are invisible to a fake clientset (no
      # resource-version conflicts) and untouched by the single-deployment e2e.
      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.34.1 -p path)" >> "$GITHUB_ENV"

      - name: Integration tests
        run: go test -tags integration -count=1 -timeout 10m ./test/integration/...
