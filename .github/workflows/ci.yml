name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: |
          go mod download
          go mod verify

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage gate
        # Fails the build if total statement coverage drops below the floor.
        # Ratchet target: raise toward 60% then 70% as root-package and e2e
        # tests land (see docs/ROADMAP.md Phase 1.1.1). Only ever raise this.
        env:
          COVERAGE_THRESHOLD: "53"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "Total coverage: ${total}% (gate: ${COVERAGE_THRESHOLD}%)"
          awk -v t="$total" -v g="$COVERAGE_THRESHOLD" 'BEGIN { exit (t+0 < g+0) ? 1 : 0 }' || {
            echo "::error::coverage ${total}% is below the ${COVERAGE_THRESHOLD}% gate"; exit 1; }

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      # Short fuzz run on each target to catch regressions on PRs. The corpus
      # lives in the Go build cache; this is a smoke test, not a soak.
      - name: Fuzz ComputeFingerprint
        run: go test -run='^$' -fuzz='^FuzzComputeFingerprint$' -fuzztime=30s ./internal/alert

      - name: Fuzz matchOrRegex
        run: go test -run='^$' -fuzz='^FuzzMatchOrRegex$' -fuzztime=30s ./internal/alert

      - name: Fuzz config Load
        run: go test -run='^$' -fuzz='^FuzzLoad$' -fuzztime=30s ./internal/config

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
