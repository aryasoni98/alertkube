name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

# Serialize releases of the same ref; never cancel a half-finished publish
# (the image/chart push must not be interrupted mid-flight).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    name: Build & Push Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Explicit ref so workflow_dispatch builds the tag, not the default branch.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # raw TAG instead of type=ref,event=tag so workflow_dispatch
          # (branch ref) still pushes the :vX.Y.Z tag the sbom/trivy/helm
          # jobs reference.
          tags: |
            type=raw,value=${{ env.TAG }}
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            # latest only moves on a real tag push of a non-prerelease, so a
            # workflow_dispatch re-publish of an old tag cannot regress it.
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(env.TAG, '-') }}

      - name: Build & push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.TAG }}
          # SLSA build provenance attestation alongside the signed image.
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      # Keyless (Sigstore) signature over the manifest digest. Verify with:
      #   cosign verify ghcr.io/<owner>/alertkube@<digest> \
      #     --certificate-identity-regexp 'https://github.com/.+/.github/workflows/release.yml@.+' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Sign image (cosign keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    steps:
      - name: Generate SBOM (syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          # Pin to the immutable digest the docker job signed, not the
          # mutable tag, so the SBOM inventories exactly the signed artifact.
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
          format: spdx-json
          output-file: alertkube-sbom.spdx.json
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: alertkube-sbom.spdx.json

  trivy:
    name: Scan image (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy scan (SARIF, non-gating)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Scan the immutable signed digest, not the mutable tag.
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # severity is ignored for SARIF output unless this is set
          limit-severities-for-sarif: true
          ignore-unfixed: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: trivy-results.sarif

      - name: Run Trivy scan (gate on fixable CRITICAL)
        # Fails the release if the signed image has a fixable CRITICAL CVE.
        # Runs after the SARIF upload so the security dashboard is populated
        # even when this gate trips. Matches the SECURITY-INSIGHTS claim that
        # the image scan gates the release.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  helm:
    name: Push Helm chart (OCI)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: docker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Log in to GHCR (Helm)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Package & push chart
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          helm package helm -d dist --version "${VERSION}" --app-version "${VERSION}"
          helm push "dist/alertkube-${VERSION}.tgz" "oci://${REGISTRY}/${{ github.repository_owner }}/charts"

      - name: Upload chart artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: helm-chart
          path: dist/*.tgz

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker, trivy, helm, sbom]
    # The image, signature, and chart are already published by the gating jobs
    # below. Create the human-facing Release as long as those succeeded, even
    # if the (non-critical) SBOM job flaked - the SBOM is then simply omitted
    # rather than blocking the Release. docker/trivy/helm remain hard gates.
    if: >-
      ${{ !cancelled()
      && needs.docker.result == 'success'
      && needs.trivy.result == 'success'
      && needs.helm.result == 'success' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download chart artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: helm-chart
          path: dist

      - name: Download SBOM artifact
        # Best-effort: a flaked SBOM job must not block the Release (see job if:).
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom
          path: dist

      - name: Compute chart version
        id: ver
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          # Do not fail the Release if the SBOM is absent (best-effort upload).
          fail_on_unmatched_files: false
          files: |
            dist/*.tgz
            dist/alertkube-sbom.spdx.json
          body: |
            ## alertkube ${{ env.TAG }}

            ### Container image
            ```
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.TAG }}
            ```
            Digest: `${{ needs.docker.outputs.digest }}`

            Image is signed with cosign (keyless) and carries SLSA build
            provenance. Verify the exact signed digest:
            ```
            cosign verify ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker.outputs.digest }} \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@.+' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            ```
            SBOM (SPDX JSON) is attached to this release.

            ### Helm
            ```
            helm install alertkube oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/alertkube --version ${{ steps.ver.outputs.version }}
            ```

            See `CHANGELOG.md` for full details.
