name: Helm

on:
  push:
    branches: [master, main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint helm

      - name: Helm template (default values)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set slack.webhookUrl=https://hooks.slack.com/services/T/B/X \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

      - name: Helm template (servicemonitor on)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set slack.webhookUrl=https://hooks.slack.com/services/T/B/X \
            --set metrics.serviceMonitor.enabled=true \
            > /tmp/render-sm.yaml
          test -s /tmp/render-sm.yaml

      - name: Helm template (namespace scope + leader election)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set rbac.scope=namespace \
            --set replicaCount=2 \
            --set leaderElection.enabled=true \
            > /tmp/render-ns.yaml
          test -s /tmp/render-ns.yaml

      - name: Helm template (prometheusRule + serviceMonitor)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set slack.webhookUrl=https://hooks.slack.com/services/T/B/X \
            --set metrics.serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            > /tmp/render-mon.yaml
          test -s /tmp/render-mon.yaml
          grep -q "kind: PrometheusRule" /tmp/render-mon.yaml

      - name: kubeconform validation
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -ignore-missing-schemas -summary \
            /tmp/render.yaml /tmp/render-sm.yaml /tmp/render-ns.yaml /tmp/render-mon.yaml

  helm-docs:
    name: helm-docs (drift check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install helm-docs
        run: |
          VERSION=1.14.2
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${VERSION}/helm-docs_${VERSION}_Linux_x86_64.tar.gz" \
            | tar xz helm-docs
          sudo install helm-docs /usr/local/bin/

      - name: Regenerate chart README
        run: helm-docs --chart-search-root=helm --template-files=README.md.gotmpl

      - name: Fail if helm/README.md is out of date
        run: |
          if ! git diff --exit-code helm/README.md; then
            echo "::error::helm/README.md is stale. Run 'make helm-docs' and commit the result." >&2
            exit 1
          fi

  chart-testing:
    name: chart-testing (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
        with:
          version: v3.16.0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2

      - name: ct lint
        run: ct lint --config .github/ct.yaml --all
