name: Helm

on:
  push:
    branches: [master, main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "helm/**"
      - ".github/workflows/helm.yml"

permissions:
  contents: read

concurrency:
  group: helm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.14.0

      - name: Helm lint
        run: helm lint helm

      - name: Chart version drift (appVersion + artifacthub image tag)
        # release-please bumps Chart.yaml version + appVersion, but cannot
        # reach the image tag inside the artifacthub.io/images `|` block.
        # Assert all three agree so a release cannot ship a stale tag.
        run: |
          chart_ver="$(grep -E '^version:' helm/Chart.yaml | awk '{print $2}')"
          app_ver="$(grep -E '^appVersion:' helm/Chart.yaml | awk '{print $2}' | tr -d '"')"
          # `|| true`: a missing/reformatted annotation must yield an empty tag
          # and trip the explicit check below, not abort the step under pipefail.
          img_tag="$(grep -oE 'alertkube:v[0-9]+\.[0-9]+\.[0-9]+' helm/Chart.yaml | head -1 | sed 's/.*://' || true)"
          echo "version=$chart_ver appVersion=$app_ver imageTag=$img_tag"
          if [ "$app_ver" != "$chart_ver" ]; then
            echo "::error::Chart.yaml appVersion ($app_ver) != version ($chart_ver)" >&2; exit 1
          fi
          if [ "$img_tag" != "v$chart_ver" ]; then
            echo "::error::artifacthub.io/images tag ($img_tag) != chart version (v$chart_ver); bump the annotation in helm/Chart.yaml" >&2; exit 1
          fi

      - name: Helm template (default values)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set api.allowUnauthenticatedRead=true \
            --set slack.webhookUrl=https://hooks.slack.com/services/T/B/X \
            > /tmp/render.yaml
          test -s /tmp/render.yaml

      - name: Assert rendered Deployment image == chart version
        # The drift step above checks the Chart.yaml metadata; this checks what
        # actually ships - the Deployment's image tag defaults to the chart
        # version, so a version/repository mismatch fails here.
        run: |
          want="ghcr.io/aryasoni98/alertkube:v$(grep -E '^version:' helm/Chart.yaml | awk '{print $2}')"
          if ! grep -q "image: \"$want\"" /tmp/render.yaml; then
            echo "::error::rendered Deployment image != $want" >&2
            grep 'image:' /tmp/render.yaml >&2 || true
            exit 1
          fi

      - name: Helm template (servicemonitor on)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set api.allowUnauthenticatedRead=true \
            --set slack.webhookUrl=https://hooks.slack.com/services/T/B/X \
            --set metrics.serviceMonitor.enabled=true \
            > /tmp/render-sm.yaml
          test -s /tmp/render-sm.yaml

      - name: Helm template (namespace scope + leader election)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set api.allowUnauthenticatedRead=true \
            --set rbac.scope=namespace \
            --set replicaCount=2 \
            --set leaderElection.enabled=true \
            > /tmp/render-ns.yaml
          test -s /tmp/render-ns.yaml

      - name: Helm template (prometheusRule + serviceMonitor)
        run: |
          helm template alertkube helm \
            --set cluster=ci-test \
            --set api.allowUnauthenticatedRead=true \
            --set slack.webhookUrl=https://hooks.slack.com/services/T/B/X \
            --set metrics.serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true \
            > /tmp/render-mon.yaml
          test -s /tmp/render-mon.yaml
          grep -q "kind: PrometheusRule" /tmp/render-mon.yaml

      - name: kubeconform validation
        run: |
          base=https://github.com/yannh/kubeconform/releases/download/v0.6.7
          curl -fsSLo kubeconform-linux-amd64.tar.gz "$base/kubeconform-linux-amd64.tar.gz"
          curl -fsSLo CHECKSUMS "$base/CHECKSUMS"
          # Verify the asset against the release's published checksum before exec.
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar xzf kubeconform-linux-amd64.tar.gz kubeconform
          ./kubeconform -strict -ignore-missing-schemas -summary \
            /tmp/render.yaml /tmp/render-sm.yaml /tmp/render-ns.yaml /tmp/render-mon.yaml

  helm-docs:
    name: helm-docs (drift check)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install helm-docs
        run: |
          VERSION=1.14.2
          base="https://github.com/norwoodj/helm-docs/releases/download/v${VERSION}"
          asset="helm-docs_${VERSION}_Linux_x86_64.tar.gz"
          curl -fsSLo "$asset" "$base/$asset"
          curl -fsSLo checksums.txt "$base/checksums.txt"
          # Verify the asset against the release's published checksum before exec.
          grep " ${asset}$" checksums.txt | sha256sum -c -
          tar xzf "$asset" helm-docs
          sudo install helm-docs /usr/local/bin/

      - name: Regenerate chart README
        run: helm-docs --chart-search-root=helm --template-files=README.md.gotmpl

      - name: Fail if helm/README.md is out of date
        run: |
          if ! git diff --exit-code helm/README.md; then
            echo "::error::helm/README.md is stale. Run 'just helm-docs' and commit the result." >&2
            exit 1
          fi

  chart-testing:
    name: chart-testing (lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2

      - name: ct lint
        # `charts: [helm]` is set in .github/ct.yaml; ct rejects --all together
        # with an explicit chart list, so rely on the config's chart list.
        run: ct lint --config .github/ct.yaml
