name: Scorecard

# OpenSSF Scorecard - supply-chain security posture analysis.
# Publishes results so the README badge and https://securityscorecards.dev work,
# and uploads SARIF to the GitHub Security tab.

on:
  branch_protection_rule:
  schedule:
    - cron: "21 4 * * 1" # Mondays 04:21 UTC
  push:
    branches: [master, main]

# Top-level: least privilege. The job elevates only what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF to the code-scanning dashboard
      id-token: write        # publish results to the OpenSSF API (badge)
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publishing makes the score public and powers the README badge.
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: scorecard-results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v3
        with:
          sarif_file: scorecard-results.sarif
