name: Dependency Review

# Gates PRs on newly introduced vulnerable or disallowed-license dependencies.
# Complements Trivy (CVE scan of the whole tree) and Dependabot (update PRs)
# by reviewing the dependency *delta* a PR introduces, at PR time.
on:
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  group: dep-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
