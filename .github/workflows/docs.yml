name: Docs

# Builds the MkDocs site with strict link/nav checking so broken docs fail PRs.
# Deployment is intentionally not wired here — the repo's GitHub Pages currently
# serves the marketing landing page (docs/). See ADR-0002 for the hosting
# decision still to be made.

on:
  push:
    branches: [master, main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Build docs (strict)
        run: mkdocs build --strict
        working-directory: docs-site
