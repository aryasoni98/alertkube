name: Docs

# Builds the MkDocs site with strict link/nav checking so broken docs fail PRs.
# Deployment is intentionally not wired here — the repo's GitHub Pages currently
# serves the marketing landing page (docs/). See ADR-0002 for the hosting
# decision still to be made.

on:
  push:
    branches: [master, main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "docs-site/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build (strict)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r docs-site/requirements.txt

      - name: Build docs (strict)
        run: mkdocs build --strict
        working-directory: docs-site
