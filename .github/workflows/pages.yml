name: Pages

on:
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page + manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Build manual (MkDocs) into web/manual
        # The Pages artifact is the web/ tree (landing page at root). Build the
        # MkDocs manual into web/manual so it deploys at /alertkube/manual/ -
        # the URL the landing-page navbar's "Docs" link targets. --strict fails
        # the deploy on a broken nav/link, so a bad mkdocs nav blocks publish.
        working-directory: docs
        run: |
          pip install -r requirements.txt
          mkdocs build --strict -d "${GITHUB_WORKSPACE}/web/manual"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
