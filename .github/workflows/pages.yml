name: Pages

on:
  push:
    branches: [master, main]
    paths:
      - "docs/**"
      - "docs-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page + manual
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Build manual (MkDocs) into docs/manual
        # The Pages artifact is the docs/ tree (landing page at root). Build the
        # MkDocs manual into docs/manual so it deploys at /alertkube/manual/ -
        # the URL the landing-page navbar's "Docs" link targets. --strict fails
        # the deploy on a broken nav/link, so a bad mkdocs nav blocks publish.
        working-directory: docs-site
        run: |
          pip install -r requirements.txt
          mkdocs build --strict -d "${GITHUB_WORKSPACE}/docs/manual"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
