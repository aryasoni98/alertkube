name: Sync labels

# Applies .github/labels.yml to the repository's GitHub labels.
# Runs when the label definitions change, or on demand.

on:
  push:
    branches: [master, main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels to GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Apply labels
        uses: crazy-max/ghaction-github-labeler@24d110aa46a59976b8a7f35518cb7f14f434c916 # v5
        with:
          yaml-file: .github/labels.yml
          # Set to false here; flip to true once you have reviewed the diff and
          # are happy for labels not in labels.yml to be deleted.
          skip-delete: true
          dry-run: false
