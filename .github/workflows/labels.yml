name: Sync labels

# Applies .github/labels.yml to the repository's GitHub labels.
# Runs when the label definitions change, or on demand.

on:
  push:
    branches: [master, main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels to GitHub
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Apply labels
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          # Set to false here; flip to true once you have reviewed the diff and
          # are happy for labels not in labels.yml to be deleted.
          skip-delete: true
          dry-run: false
