# chart-testing (ct) configuration. https://github.com/helm/chart-testing
# Used by the Helm CI workflow to lint the chart and (optionally) install it.
target-branch: master
chart-dirs:
  - .
chart-repos: []
# The chart lives at ./helm, not in a charts/ dir, so point ct at it directly.
charts:
  - helm
helm-extra-args: --timeout 180s
# Disabled: ct validates each maintainer `name` as a GitHub username, but
# Chart.yaml uses a human display name ("Arya Soni") with the GitHub profile
# in the `url` field, which is the conventional, Artifact-Hub-friendly form.
validate-maintainers: false
check-version-increment: false # release-please / manual bumps own the version
