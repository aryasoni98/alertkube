name: Bug report
description: Something in alertkube is not working as documented.
title: "[bug]: "
labels: ["kind/bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** report security issues here -
        see [SECURITY.md](https://github.com/aryasoni98/alertkube/blob/master/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: A CrashLoopBackOff pod did not produce a Slack alert, but I expected one.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Include `kubectl` commands, the resource that should have alerted, and which sink you expected.
      placeholder: |
        1. Install chart with `helm upgrade --install ... --set slack.webhookUrl=...`
        2. `kubectl run boom --image=busybox -- /bin/false`
        3. Wait for CrashLoopBackOff
        4. No alert arrives
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant config
      description: Your `config.yaml` (routing/behavior/filters) with secrets redacted. This will be rendered as a code block.
      render: yaml
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Controller logs
      description: Output of `kubectl logs deploy/alertkube` around the time of the issue, secrets redacted.
      render: shell
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: alertkube version
      description: Image tag or chart version (e.g. v0.2.1).
    validations:
      required: true
  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
      description: Output of `kubectl version --short` (server version).
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Install method
      options:
        - Helm (OCI chart)
        - Helm (git checkout)
        - Raw manifests
        - go run . (local dev)
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
