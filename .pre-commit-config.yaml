# Optional local pre-commit hooks. Install with:  pip install pre-commit && pre-commit install
# Mirrors the cheap CI checks so you catch them before pushing. CI remains the
# source of truth; these are a convenience.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(.*\.svg|LICENSE-2.0\.txt)$'
      - id: end-of-file-fixer
        exclude: '^(.*\.svg)$'
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
        # Helm templates and the mkdocs config use non-standard YAML (Go
        # templating / Python tags) that this generic parser cannot load.
        exclude: '^(helm/templates/.*|docs/mkdocs\.yml)$'
      - id: check-added-large-files
        args: [--maxkb=512]

  # Go hooks run the locally-installed toolchain (language: system) rather than
  # a third-party hook repo, so there is no external rev to pin or let drift
  # (the old dnephin/pre-commit-golang is unmaintained) and versions always
  # match your `go` install. Mirrors the cheap CI checks.
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: gofmt -l -w
        language: system
        types: [go]
      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        types: [go]
        pass_filenames: false
      - id: go-mod-tidy
        name: go mod tidy
        entry: go mod tidy
        language: system
        files: '^(go\.mod|go\.sum)$'
        pass_filenames: false

  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.25
    hooks:
      - id: helmlint
